# Netlify configuration for Adsterra Bot Frontend
# Deployed with Next.js and OpenNextJS plugin for dynamic routes and API

[build]
  command = "npm run build:netlify"
  environment = { NODE_VERSION = "18.17.0" }

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables
[context.production.environment]
  REACT_APP_API_URL = "http://100.48.93.18:3000"
  NEXT_PUBLIC_API_URL = "http://100.48.93.18:3000"

[context.preview.environment]
  REACT_APP_API_URL = "http://100.48.93.18:3000"
  NEXT_PUBLIC_API_URL = "http://100.48.93.18:3000"

[context.branch-deploy.environment]
  REACT_APP_API_URL = "http://100.48.93.18:3000"
  NEXT_PUBLIC_API_URL = "http://100.48.93.18:3000"
