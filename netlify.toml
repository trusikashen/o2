# Netlify configuration for Adsterra Bot Frontend
# Deployed with Next.js and OpenNextJS plugin for dynamic routes and API

# Netlify configuration for Adsterra Bot Frontend
# Static frontend deployment - API calls proxied to AWS backend

[build]
  command = "npm run build:netlify"
  publish = "out"
  environment = { NODE_VERSION = "18.17.0" }

# Redirect API calls to AWS backend
[[redirects]]
  from = "/api/*"
  to = "http://100.48.93.18:3000/api/:splat"
  status = 200
  force = true

# Environment variables
[context.production.environment]
  NEXT_PUBLIC_API_URL = "http://100.48.93.18:3000"
  REACT_APP_API_URL = "http://100.48.93.18:3000"
  APP_USERNAME = "aixsystem"
  APP_PASSWORD = "nemesisN3M3616"

